services:
  cvat_server:
    environment:
      DJANGO_SETTINGS_MODULE: settings
      CVAT_NUCLIO_INVOKE_METHOD: dashboard
    volumes:
      - ./local-settings.py:/home/django/settings.py:ro
      - cvat_share:/home/django/share:ro
  cvat_worker_import:
    volumes:
      - cvat_share:/home/django/share:ro
  cvat_worker_export:
    volumes:
      - cvat_share:/home/django/share:ro
  cvat_worker_annotation:
    environment:
      CVAT_NUCLIO_INVOKE_METHOD: dashboard
    volumes:
      - cvat_share:/home/django/share:ro
  cvat_worker_chunks:
    volumes:
      - cvat_share:/home/django/share:ro

volumes:
  cvat_share:
    driver_opts:
      type: none
      device: /home/jaeho/ent_cv/data
      o: bind
